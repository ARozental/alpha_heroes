# Battle and campaign models together (campaign_model.joint), the GPU to ourselves (no Zonkey run).
#   .venv/bin/python -m campaign_model.joint --run NAME --machine configs/machines/rtx5090/joint-gpu-free.toml
#
# Machine: RTX 5090 32 GB (Windows WDDM driver 610.88; torch 2.14.1+cu130), AMD Ryzen 9 9900X 12 cores / 24 threads,
#   31 GB RAM; Windows 11 + WSL2 Ubuntu 26.04 capped at 28 GB RAM + 8 GB swap (C:\Users\Owner\.wslconfig), repo on
#   WSL's ext4.
# Case: nothing else on the GPU; WSL's ~27 GB for us.
#
# Since 2026-10-30 (supply.py): one trainer process holds both models and trains them in turns (campaign.learner
# "turns"), the games are played by a DataLoader's worker processes, as many at once as the ceilings below while the
# learners take them (no game is played to be dropped), and one inference server process serves both models.
# MEASURED 2026-10-30 (the GPU alone, runtime/bench_mixed.py):
#   - the campaign step: 146 ms a 128-decision micro-batch eager (~875 decisions/s); the battle step 36 ms a 256 (7,100/s).
#   - inference beside the trainer: a second process on the GPU costs the trainer 54% of its steps when it answers
#     requests as they come, ~40% when it waits 10-15 ms to batch them (inference_batch_wait_ms); the Windows GPU is
#     time-sliced between processes by demand. In the trainer's own process (a thread) it cost 12x (the interpreter
#     lock); on the CPU a campaign decision is 26 ms of a core under load (38/s a core: too slow for the games here).
#     So: one server process on the GPU, batching, for both models.
#   - RAM is the limit on games: a campaign game's VCMI client 0.35-0.8 GB, a battle actor's 0.2-1.3 GB, the trainer
#     ~5 GB, the server ~3 GB, a loader worker ~0.1-0.3 GB. The workers start no game under 3 GB available.
eval_workers = 4  # (8 battle processes of an eval were ~2.4 GB at the memory floor, 2026-10-31)
# The battle model's inference on this machine's CPU (3 processes, ~13 ms a decision each: the battles need ~150
# decisions/s), the campaign's on the Mac (runtime/joint5_endpoints.sh: inference_endpoints), whose cores it saturated
# with 7 processes while its battle servers idled (2026-10-30 23:45). Without endpoints: one CUDA server for both
inference_device = "cpu"
inference_processes = 3
inference_batch_wait_ms = 0
buffer_decisions = 8000
# Generated battles at once here, at most (the learner's demand decides how many play: supply.py). With the Mac serving
# the inference (inference_endpoints), the battle learner waited 10-17 s an update on 6 (2026-10-30), 11 GB of RAM free.
# 4 since 2026-10-31: the campaign model is the one to train most (the user), the battle model's updates fewer and larger
generated_actors = 4
# The battle model's steps (the user, 2026-10-31): its eval flat at ~+0.09 for ~1,100 updates of 256-decision steps,
# signal_ratio ~0.12 (mostly noise); each step now averages ~3,072 decisions (12 minibatches accumulated), at 1e-5, 3 passes
learning_rate = 1e-5
# The trainer's matmuls as TF32 (2026-10-31; full fp32 before): campaign updates were 86-111 s a ~35k-decision update
tf32 = true
accumulate = 12
ppo_passes = 3
# The battle evals' sets three times as large (2026-10-31: a set's standard error was ~0.03, the total's ~0.013, more than
# the changes to see; with the generator, eval_seeds plays no part): ~600 battles an opponent, ~3x the eval's time on the
# CPU beside training. A new set: its first eval also plays the opponent's own baseline once
eval_scenarios = 72
eval_neutral_scenarios = 36
eval_hard_scenarios = 72
eval_real_scenarios = 40
eval_castle_seeds = 48
# Loader workers kept for the Mac's game slots (worker.py --slots): 2 slots there, its cores on inference
remote_slots = 2
# Three updates' worth of campaign games finished and in flight (supply.py): with two, the permits emptied the pipeline
# during each 150 s update (5 of 20 games running) and the trainer then waited for the next batch of games (GPU 62%
# against 74%, 2026-10-31 01:14). Labels of games waiting two versions are redone in the labeler (learner._relabel_waiting)
ahead = 3.0

[campaign]
# Campaign games at once here, at most (a VCMI client ~0.15 GB and its loader worker ~0.17 GB real). 24 reached the memory
# floor with 10 battle actors and 8-process evals (2026-10-31 00:29); with 8 actors and 4-process evals 20 left 8 GB free
games = 24
learner = "turns"
inference_device = "cuda"
inference_processes = 1
# 128 decisions a micro-batch: ~10.7 GB of the GPU. 256 (micro_batches 2) filled the card's 32 GB (an 18 GB peak of live
# tensors plus the allocator's reserve and the graphs' pools) and the step was 1.5x slower a decision (2026-10-31 01:45)
batch_size = 512
micro_batches = 4
prepass_batch = 256
# The campaign training graphs (graphs.py): the real update was launch-bound in eager mode (the trainer's thread on the
# CPU 64% of the update, the GPU done before the next kernel came; the 146 ms benchmark used sparse synthetic states).
# Validated 2026-10-30 (runtime/check_graphs.py, allow_unused_input): gradients match eager to 5e-4, a whole update 3.5x
cuda_graphs = true
# The update's input decoding (zlib on the CPU, ~430 decisions/s a thread): 3 threads held the recorded step (15 s of waits
# in a 74 s update, the CPU half idle, 2026-10-31); ~110 MB of pinned memory a thread
decode_threads = 6
# Two passes over 32,768 decisions of 20+ games an update (b1, 2026-10-31: the better use of an idle GPU; the KL stop
# bounds the drift). Conditions: the update must stay shorter than the gap between updates (else the permits hold games
# back), and the second pass must not be cut short by the KL stop in most updates (stopped_pass in the log and
# TensorBoard: then back to 1). One pass before (fresh games rather than each seen twice; the games were then plenty)
passes = 2
decisions_per_update = 32768
min_games_per_update = 20
eval_parallel = 4  # (the memory floor: 8 games at once were ~1.3 GB during an eval)
# 48 games an eval (24 before: its standard error 0.04-0.07, more than most changes; 2026-10-31). The first 24 are the
# same setups and maps as before (evaluate.setups); the other 24's maps are generated and kept on this machine the first time
eval_games = 48
