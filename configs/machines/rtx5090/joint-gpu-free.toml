# Battle and campaign models together (campaign_model.joint), the GPU to ourselves (no Zonkey run).
#   .venv/bin/python -m campaign_model.joint --run NAME --machine configs/machines/rtx5090/joint-gpu-free.toml
#
# Machine: RTX 5090 32 GB (Windows WDDM driver 610.88; torch 2.14.1+cu130), AMD Ryzen 9 9900X 12 cores / 24 threads,
#   31 GB RAM; Windows 11 + WSL2 Ubuntu 26.04 capped at 20 GB RAM + 8 GB swap (C:\Users\Owner\.wslconfig), repo on
#   WSL's ext4.
# Case: nothing else on the GPU; WSL's ~19 GB for us.
#
# NOT MEASURED YET (2026-10-29: Zonkey was training) - an estimate from joint-gpu-shared.toml's measurements:
#   - RAM is the limit: the Mac's 6 games and 8 actors peaked at 16.7 GB here (beside Zonkey's ~3 GB: killed); alone
#     that is about all of WSL's 20 GB with nothing left for the hourly evals. 4 games and 8 actors should leave ~3 GB.
#   - campaign updates need 8,192 decisions of >= 4 games: fewer than 4 games at once starves the campaign learner.
#   - inference on the GPU (a few ms alone, to check) leaves the cores to the games; the campaign's inference server
#     too since 2026-10-29 ([campaign] below; it was always on the CPU).
#   - More games: give WSL more memory (.wslconfig: memory=26GB, then `wsl --shutdown`; that stops every WSL process,
#     Zonkey's too), then try the Mac's 6 games and 8 actors.
# To measure: runtime/measure.sh joint-free campaign_model.joint --run measure-joint-free --battle-from <checkpoint>
#   --machine <this file>, and runtime/memwatch.sh alpha-measure; note update seconds and peak memory here.
# generated_actors: the recipe's (4 since the campaign focus, 2026-10-29; its 8 campaign games are more than the 4 here).
# MEASURED 2026-10-30 (joint5 resumed here, the Mac a worker with --local):
#   - Inference on the GPU needs CUDA graphs (inference.py, ffa3f91): an eager forward was ~35 ms of launches at any
#     batch up to 64 under WSL, and with several server processes (or the learner) beside it ~200 ms; graphed, one
#     process serves ~800 campaign decisions/s (32 one-decision clients) and ~1300 battle ones (24). On the CPU a
#     campaign decision costs ~13-19 ms of a core here, a battle one 6-11 ms (12 processes: all cores, ~9 GB).
#   - RAM: WSL 28 GB (.wslconfig, raised with the user's leave). The memory guard stopped three starts: a whole game's
#     inputs decompressed at once for labels (fixed, e7014c1), then the campaign learner at 256 decisions a micro-batch
#     (v2: ~90 MB of activations a decision; 30.8 GB of the GPU, 10 GB of host for its buffers).
eval_workers = 8
inference_device = "cuda"
inference_processes = 1
buffer_decisions = 6000

[campaign]
games = 12
# The campaign's inference on the GPU, graphed (above): one process batches every game's requests
inference_device = "cuda"
inference_processes = 1
# 64 decisions a micro-batch (the batch's parts' gradients summed: the same gradient): at 256 the v2 model filled the
# 32 GB GPU and took 10 GB of host memory (2026-10-30)
batch_size = 512
micro_batches = 8
eval_parallel = 8
