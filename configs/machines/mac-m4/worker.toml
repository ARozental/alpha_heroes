# The MacBook Pro M4 (10 performance + 4 efficiency cores, 24 GB) as a worker for a run on the RTX 5090 PC (remote.py):
#   .venv/bin/python -m battle_model.worker --master <the PC's address> --machine configs/machines/mac-m4/worker.toml --local
#
# Since 2026-10-30 the master asks for each game (worker.py --slots, supply.py): this machine holds remote_slots
# connections open and plays what it is given, generated battles or campaign games, once the PC's own games are at
# their ceiling. With --local the games ask inference servers on this machine's CPU (a campaign decision ~9-12 ms of an
# M4 core, a battle one 3-7 ms, measured) instead of the PC's over Wi-Fi (16 ms a round trip).
# Memory: a campaign game's client ~0.3-0.5 GB, a battle process 0.2 GB growing to 1.3-2.7 GB before it is renewed
# (every 50 battles): 12 slots and 9 server processes fit in 24 GB.
# Serving the PC's campaign inference (--serve, 2026-10-30): 11 campaign processes (9 saturated at the PC's 24 games,
# 2026-10-31 00:29); 1 battle process for this machine's own slots' battles (the PC's are on its CPU); 2 slots: a core
# here is worth more as inference for the PC's games than as a game
remote_slots = 2
inference_processes = 1
inference_threads = 1

[campaign]
inference_processes = 11
inference_threads = 1
