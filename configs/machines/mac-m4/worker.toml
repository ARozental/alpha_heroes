# The MacBook Pro M4 (10 performance + 4 efficiency cores, 24 GB) as a worker for a run on the RTX 5090 PC (remote.py):
#   .venv/bin/python -m battle_model.worker --master <the PC's address> --machine configs/machines/mac-m4/worker.toml
#
# A worker runs only VCMI: every decision is the PC's GPU's (its inference servers over the network, ~4 KB a decision),
# so a game costs this machine ~4 ms of CPU a battle decision (measured 2026-10-29, the VCMI client and the records)
# instead of ~13 with the model on its own CPU. Most of it to the campaign games: in a joint run their battles are
# real_share (0.7) of each battle update, and the PC's own games were too few for it (joint2 waited ~35 s an update).
#
# NOT MEASURED YET as a worker. Memory: a campaign game's client ~0.3-0.5 GB, a generated actor's 0.2 GB growing
# to 1.3-2.7 GB before its process is renewed (every 50 battles): 10 games and 2 actors should fit in 24 GB.
generated_actors = 2

[campaign]
games = 10
